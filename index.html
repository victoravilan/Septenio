<script>
/* ---- Instalación como app (PWA) + Service Worker ----
   Todo está protegido: si el navegador o el visor no lo permiten, la app sigue funcionando igual. */
(function () {
  try {
    var deferred = null, btn = document.getElementById('btnInstalar');

    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault(); deferred = e;
      if (btn) btn.classList.remove('hidden');
    });
    window.addEventListener('appinstalled', function () {
      deferred = null; if (btn) btn.classList.add('hidden');
    });
    if (btn) btn.addEventListener('click', function () {
      if (!deferred) return;
      deferred.prompt();
      deferred.userChoice.then(function (r) {
        if (r && r.outcome === 'accepted') btn.classList.add('hidden');
        deferred = null;
      }).catch(function () { });
    });

    // El registro va en su propia función con try/catch: en visores embebidos
    // (iframe con sandbox sin allow-same-origin) leer navigator.serviceWorker
    // lanza SecurityError, y eso no puede romper la app.
    function registrarSW() {
      try {
        if (!('serviceWorker' in navigator)) return;
        if (window.isSecureContext === false) return; // http sin TLS o iframe aislado: nada que hacer
        var seguro = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        if (!seguro) return;
        navigator.serviceWorker.register('sw.js').catch(function (e) {
          console.warn('Service Worker no registrado:', e && e.message);
        });
      } catch (e) { console.warn('Service Worker no disponible:', e && e.message); }
    }
    window.addEventListener('load', registrarSW);
  } catch (e) { console.warn('PWA no disponible en este visor:', e && e.message); }
})();
</script>
<script src="app.js"></script>
