<!DOCTYPE html>
<html lang="es" data-theme="oscuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="description" content="Septenios · Tu mapa de desarrollo en ciclos de 7 años y 7 ciclos anuales de 52 días.">
<title>Septenios · Ciclos de 7 años y de 52 días</title>

<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Septenios">
<meta name="mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="dark light">

<style>
/* ================= SEPTENIOS · diseño móvil v2 ================= */
:root{
  --bg:#080c1a; --bg2:#111731;
  --card:rgba(255,255,255,.055); --card2:rgba(255,255,255,.028);
  --line:rgba(255,255,255,.10);
  --txt:#eef1ff; --muted:#a5abd0;
  --gold:#f5c56b; --violet:#8b6cff; --mint:#5fe3bf; --rose:#ff86a8;
  --sky:#69b8ff; --green:#9fd67a; --danger:#ff7a7a;
  --r:20px; --shadow:0 14px 40px rgba(0,0,0,.45);
  --nav-h:66px;
}
html[data-theme="claro"]{
  --bg:#f6f5fb; --bg2:#ffffff;
  --card:rgba(255,255,255,.86); --card2:rgba(255,255,255,.62);
  --line:rgba(30,26,70,.10);
  --txt:#1a1730; --muted:#605c85;
  --gold:#c98a09; --violet:#6a48e8; --mint:#0f9c7c; --rose:#d64a78;
  --sky:#2b7fd4; --green:#4f9c2e; --danger:#cf3f3f;
  --shadow:0 12px 30px rgba(31,25,80,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);-webkit-font-smoothing:antialiased;overflow-x:hidden;
}
.aurora{position:fixed;inset:-20% -10%;z-index:0;filter:blur(60px);opacity:.55;pointer-events:none}
.aurora i{position:absolute;display:block;border-radius:50%;mix-blend-mode:screen;animation:flotar 22s ease-in-out infinite}
.aurora i:nth-child(1){width:60vw;height:60vw;left:-12%;top:-8%;background:radial-gradient(circle,#3b2f8f,transparent 68%)}
.aurora i:nth-child(2){width:52vw;height:52vw;right:-14%;top:6%;background:radial-gradient(circle,#8b5a2b,transparent 68%);animation-delay:-7s}
.aurora i:nth-child(3){width:66vw;height:66vw;left:8%;bottom:-24%;background:radial-gradient(circle,#1f6f6f,transparent 70%);animation-delay:-14s}
html[data-theme="claro"] .aurora{opacity:.28;filter:blur(70px)}
@keyframes flotar{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(4%,-4%) scale(1.08)}}
.stars{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.45;
  background-image:radial-gradient(1.3px 1.3px at 20% 30%,#fff 50%,transparent),radial-gradient(1.1px 1.1px at 70% 12%,#ffe6b0 50%,transparent),
  radial-gradient(1px 1px at 42% 78%,#fff 50%,transparent),radial-gradient(1.2px 1.2px at 88% 62%,#cfd8ff 50%,transparent),
  radial-gradient(1px 1px at 8% 88%,#fff 50%,transparent);
  background-size:340px 340px,420px 420px,300px 300px,520px 520px,260px 260px}
html[data-theme="claro"] .stars{display:none}
.hidden{display:none !important}
h1,h2,h3,h4{line-height:1.25;margin:0}
p{line-height:1.62;margin:0}
button{font:inherit;color:inherit}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------- estructura ---------- */
.app-wrap{position:relative;z-index:2;min-height:100dvh}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(12px + env(safe-area-inset-top)) 16px 10px;backdrop-filter:blur(16px);
  background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 92%,transparent),color-mix(in srgb,var(--bg) 60%,transparent));
  border-bottom:1px solid var(--line)}
.brand-mini{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mini svg{width:34px;height:34px;color:var(--gold);flex:0 0 auto}
.brand-name{font-weight:800;font-size:1rem;letter-spacing:.3px}
.brand-tag{font-size:.68rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
.top-actions{display:flex;gap:6px}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  display:grid;place-items:center;font-size:1rem;cursor:pointer;transition:.2s;flex:0 0 auto}
.icon-btn:active{transform:scale(.94)}
.app-main{max-width:600px;margin:0 auto;padding:14px 14px calc(var(--nav-h) + 34px + env(safe-area-inset-bottom))}
.view{display:none}
.view.active{display:block;animation:sube .45s cubic-bezier(.2,.7,.3,1) both}
@keyframes sube{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(7,1fr);
  padding:7px 4px calc(7px + env(safe-area-inset-bottom));backdrop-filter:blur(18px);
  background:color-mix(in srgb,var(--bg) 88%,transparent);border-top:1px solid var(--line)}
.nav-item{background:transparent;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 1px;
  color:var(--muted);font-size:.6rem;cursor:pointer;transition:.2s;letter-spacing:.2px}
.nav-item svg{width:20px;height:20px}
.nav-item.active{color:var(--gold)}
.nav-item.active svg{transform:translateY(-1px) scale(1.06)}

/* ---------- tarjetas ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:13px;
  backdrop-filter:blur(14px);box-shadow:var(--shadow)}
.card.hero{background:linear-gradient(155deg,color-mix(in srgb,var(--gold) 20%,transparent),color-mix(in srgb,var(--violet) 18%,transparent));
  border-color:color-mix(in srgb,var(--gold) 40%,transparent);position:relative;overflow:hidden}
.card.hero::after{content:"";position:absolute;width:220px;height:220px;right:-70px;top:-90px;border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--gold) 45%,transparent),transparent 70%)}
.card.plano{background:var(--card2);box-shadow:none}
.kicker{font-size:.66rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);font-weight:800}
h2.sec{font-size:1.08rem;margin-bottom:7px}
h3.mini{font-size:.92rem;margin-bottom:6px}
.muted{color:var(--muted);font-size:.85rem}
.age-big{font-size:2.6rem;font-weight:800;letter-spacing:-1.4px;line-height:1.02;
  background:linear-gradient(92deg,var(--txt),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:6px 11px;font-size:.74rem}
.chip.gold{background:color-mix(in srgb,var(--gold) 18%,transparent);border-color:color-mix(in srgb,var(--gold) 45%,transparent);color:var(--gold)}
.chip.violet{background:color-mix(in srgb,var(--violet) 18%,transparent);border-color:color-mix(in srgb,var(--violet) 45%,transparent);color:var(--violet)}
.chip.mint{background:color-mix(in srgb,var(--mint) 18%,transparent);border-color:color-mix(in srgb,var(--mint) 45%,transparent);color:var(--mint)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:color-mix(in srgb,var(--bg2) 60%,transparent);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:1.02rem}
.stat span{font-size:.63rem;color:var(--muted);letter-spacing:.3px}
.bar{height:9px;border-radius:9px;background:color-mix(in srgb,var(--txt) 12%,transparent);overflow:hidden;margin:9px 0 6px}
.bar>i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--gold),var(--violet));transition:width 1.1s cubic-bezier(.2,.8,.3,1)}
.bar-labels{display:flex;justify-content:space-between;font-size:.68rem;color:var(--muted);gap:8px}
ul.clean{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:7px}
ul.clean li{position:relative;padding-left:17px;font-size:.86rem;line-height:1.55}
ul.clean li::before{content:"";position:absolute;left:3px;top:.55em;width:6px;height:6px;border-radius:50%;background:var(--gold)}
ul.clean.mint li::before{background:var(--mint)}
ul.clean.violet li::before{background:var(--violet)}
ul.clean.rose li::before{background:var(--rose)}
.pillar{display:flex;gap:10px;padding:11px;border-radius:15px;background:var(--card2);border:1px solid var(--line);margin-bottom:8px}
.pillar .ico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:1rem;flex:0 0 auto;background:var(--card)}
.pillar h4{font-size:.85rem;margin-bottom:2px}
.pillar p{font-size:.84rem;color:var(--muted)}
.quote{border-left:3px solid var(--gold);padding:7px 12px;margin:10px 0 0;color:color-mix(in srgb,var(--gold) 70%,var(--txt));font-style:italic;font-size:.9rem}
.disclaimer{background:var(--card2);border:1px dashed var(--line);border-radius:15px;padding:12px;font-size:.78rem;color:var(--muted)}
.notice{background:color-mix(in srgb,var(--sky) 14%,transparent);border:1px solid color-mix(in srgb,var(--sky) 35%,transparent);
  padding:11px 13px;border-radius:13px;font-size:.84rem}
.warn{position:relative;z-index:50;background:linear-gradient(90deg,color-mix(in srgb,var(--gold) 26%,transparent),color-mix(in srgb,var(--rose) 20%,transparent));
  border-bottom:1px solid color-mix(in srgb,var(--gold) 42%,transparent);font-size:.76rem;line-height:1.55;padding:10px 16px;text-align:center}

/* ---------- formularios ---------- */
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:.72rem;letter-spacing:.5px;color:var(--muted);text-transform:uppercase}
input,select,textarea{width:100%;background:color-mix(in srgb,var(--bg2) 55%,transparent);border:1px solid var(--line);
  border-radius:13px;padding:12px 13px;color:var(--txt);font-size:.94rem;outline:none;transition:.2s;appearance:none;font-family:inherit}
input:focus,select:focus,textarea:focus{border-color:color-mix(in srgb,var(--gold) 65%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 14%,transparent)}
input[type=date]{color-scheme:dark}
html[data-theme="claro"] input[type=date]{color-scheme:light}
.pwd-wrap{position:relative}
.pwd-wrap input{padding-right:44px}
.eye{position:absolute;right:5px;top:50%;transform:translateY(-50%);background:transparent;border:0;color:var(--muted);cursor:pointer;padding:6px 8px;font-size:1rem}
.btn{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 16px;font-size:.93rem;font-weight:600;cursor:pointer;transition:.2s;width:100%}
.btn.primary{background:linear-gradient(135deg,var(--gold),color-mix(in srgb,var(--violet) 85%,var(--gold)));color:#160f28;border:0;
  box-shadow:0 10px 26px color-mix(in srgb,var(--violet) 32%,transparent)}
html[data-theme="claro"] .btn.primary{color:#fff}
.btn.primary:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--muted);font-weight:500;font-size:.84rem;padding:9px}
.btn.tiny{width:auto;padding:8px 13px;font-size:.78rem;color:var(--gold);border-color:color-mix(in srgb,var(--gold) 40%,transparent);
  background:color-mix(in srgb,var(--gold) 10%,transparent)}
.btn.danger{background:color-mix(in srgb,var(--danger) 14%,transparent);border-color:color-mix(in srgb,var(--danger) 40%,transparent);color:var(--danger)}
.msg{min-height:16px;font-size:.79rem;color:var(--danger);text-align:center}
.msg.ok{color:var(--mint)}
.hint{color:var(--muted);font-size:.72rem}

/* ---------- riel de fases y septenios ---------- */
.fases{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}
.fase{border:1px solid var(--line);border-radius:13px;padding:9px 8px;text-align:center;background:var(--card2);position:relative;overflow:hidden}
.fase b{display:block;font-size:.82rem}
.fase span{font-size:.63rem;color:var(--muted)}
.fase.on{background:linear-gradient(150deg,color-mix(in srgb,var(--gold) 26%,transparent),color-mix(in srgb,var(--violet) 22%,transparent));
  border-color:color-mix(in srgb,var(--gold) 50%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--gold) 20%,transparent)}
.rail{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;margin:0 -2px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail-item{flex:0 0 auto;min-width:96px;border:1px solid var(--line);border-radius:15px;padding:9px 10px;background:var(--card2);cursor:pointer;text-align:left}
.rail-item b{display:block;font-size:.76rem;white-space:nowrap}
.rail-item span{font-size:.62rem;color:var(--muted)}
.rail-item.on{background:linear-gradient(150deg,color-mix(in srgb,var(--gold) 28%,transparent),color-mix(in srgb,var(--violet) 22%,transparent));
  border-color:color-mix(in srgb,var(--gold) 55%,transparent)}
.rail-item .dot{width:22px;height:22px;border-radius:8px;display:grid;place-items:center;font-size:.68rem;font-weight:800;margin-bottom:4px;background:var(--card)}

/* ---------- acordeones ---------- */
.acc{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:11px;background:var(--card2)}
.acc.now{border-color:color-mix(in srgb,var(--gold) 55%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--gold) 18%,transparent),0 12px 28px rgba(0,0,0,.28)}
.acc-head{display:flex;align-items:center;gap:11px;width:100%;background:transparent;border:0;padding:14px;text-align:left;cursor:pointer}
.acc-num{width:33px;height:33px;border-radius:11px;display:grid;place-items:center;font-size:.82rem;font-weight:800;flex:0 0 auto;background:var(--card);color:var(--gold)}
.acc.now .acc-num{background:linear-gradient(135deg,var(--gold),var(--violet));color:#160f28}
.acc-title{flex:1;min-width:0}
.acc-title b{display:block;font-size:.93rem}
.acc-title span{font-size:.73rem;color:var(--muted);display:block}
.acc-chev{transition:.3s;color:var(--muted);flex:0 0 auto}
.acc.open .acc-chev{transform:rotate(180deg)}
.acc-body{display:none;padding:0 14px 15px;border-top:1px solid var(--line)}
.acc.open .acc-body{display:block;animation:sube .3s ease both}
.acc-body>*{margin-top:12px}
.tag-now{background:color-mix(in srgb,var(--gold) 20%,transparent);color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);
  border-radius:999px;padding:2px 8px;font-size:.62rem;white-space:nowrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.mini-box{border:1px solid var(--line);border-radius:13px;padding:9px 10px;background:var(--card2)}
.mini-box span{display:block;font-size:.62rem;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.mini-box b{font-size:.84rem;font-weight:600}

/* ---------- anillo ---------- */
.ring-box{display:flex;align-items:center;gap:13px}
.ring{width:152px;height:152px;flex:0 0 auto}
.ring svg{width:100%;height:100%;overflow:visible}
.ring .seg{transition:opacity .4s}
.ring .gl{fill:var(--txt);text-anchor:middle;dominant-baseline:central;font-size:15px;stroke:none}
.ring .ctr{font-size:12.5px;font-weight:800;fill:var(--txt);text-anchor:middle}
.ring .ctr2{font-size:8.6px;fill:var(--muted);text-anchor:middle;letter-spacing:.5px}
.ring-side{flex:1;min-width:0}

/* ---------- diario / plan ---------- */
.note{border:1px solid var(--line);border-radius:15px;padding:12px;background:var(--card2);margin-bottom:10px}
.note .nd{font-size:.66rem;color:var(--gold);letter-spacing:.5px;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px}
.note p{font-size:.87rem;margin-top:6px;white-space:pre-wrap}
.note .del{margin-top:8px;font-size:.72rem;color:var(--danger);background:transparent;border:0;padding:0;cursor:pointer}
.area-bar{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.area-bar .nm{width:84px;font-size:.74rem;color:var(--muted);flex:0 0 auto}
.area-bar .tk{flex:1;height:8px;border-radius:8px;background:color-mix(in srgb,var(--txt) 10%,transparent);overflow:hidden}
.area-bar .tk i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--sky))}
.area-bar .ct{width:22px;text-align:right;font-size:.74rem;color:var(--muted)}
.task{display:flex;align-items:flex-start;gap:9px;padding:8px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task input[type=checkbox]{width:19px;height:19px;flex:0 0 auto;margin-top:2px;accent-color:var(--gold)}
.task.done span{text-decoration:line-through;color:var(--muted)}
.task span{flex:1;font-size:.86rem}
.task button{background:transparent;border:0;color:var(--muted);cursor:pointer;font-size:.9rem}
textarea{min-height:90px;resize:vertical}

/* ---------- perfil ---------- */
.line-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:.86rem}
.line-item:last-child{border-bottom:0}
.line-item span:first-child{color:var(--muted)}
.line-item b{text-align:right;word-break:break-word}

/* ---------- instalar PWA ---------- */
.icon-btn.pulse{animation:pulse 2.4s ease-in-out infinite;color:var(--gold);
  border-color:color-mix(in srgb,var(--gold) 50%,transparent)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--gold) 45%,transparent)}
  50%{box-shadow:0 0 0 7px transparent}}
@media (prefers-reduced-motion:reduce){ .icon-btn.pulse{animation:none} }

/* ---------- pie de página ---------- */
.foot{margin:4px 0 0;padding:15px 16px;text-align:center;
  border-top:1px solid var(--line);background:color-mix(in srgb,var(--card) 55%,transparent);
  border-radius:var(--r) var(--r) 0 0}
.foot p{line-height:1.5}
.foot-l1{font-size:.78rem;color:var(--muted)}
.foot-l1 b{color:color-mix(in srgb,var(--gold) 82%,var(--txt));font-weight:700}
.foot-l2{font-size:.7rem;letter-spacing:.6px;color:var(--muted);opacity:.85;margin-top:3px}

/* ---------- mente 60+ ---------- */
.evid{padding:11px 0;border-top:1px solid var(--line)}
.evid:first-child{border-top:0;padding-top:2px}
.evid h4{font-size:.9rem;margin-bottom:4px;color:color-mix(in srgb,var(--gold) 78%,var(--txt))}
.evid p{font-size:.85rem;color:var(--txt);line-height:1.55}
.evid .fz{margin-top:5px;font-size:.72rem;color:var(--muted);font-style:italic}

.fig{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.fig:first-child{border-top:0;padding-top:2px}
.fig-edad{flex:0 0 auto;width:52px;text-align:center;background:var(--card2);border:1px solid var(--line);
  border-radius:12px;padding:6px 2px;line-height:1.15}
.fig-edad b{display:block;font-size:1.12rem;color:var(--gold)}
.fig-edad span{font-size:.58rem;letter-spacing:.7px;text-transform:uppercase;color:var(--muted)}
.fig-txt{flex:1;min-width:0}
.fig-txt h4{font-size:.9rem;margin-bottom:3px}
.fig-txt p{font-size:.83rem;color:var(--txt);line-height:1.5}
.fig-txt .cp{font-size:.62rem;letter-spacing:.7px;text-transform:uppercase;color:var(--violet);margin-bottom:4px;font-weight:700}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 24px + env(safe-area-inset-bottom));transform:translate(-50%,22px);
  background:color-mix(in srgb,var(--bg2) 96%,transparent);border:1px solid var(--line);padding:11px 16px;border-radius:14px;
  font-size:.83rem;z-index:99;opacity:0;pointer-events:none;transition:.3s;box-shadow:var(--shadow);max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (min-width:620px){ .app-main{padding-bottom:calc(var(--nav-h) + 44px)} .ring{width:172px;height:172px} }

@media print{
  body{background:#fff;color:#111}
  .aurora,.stars,.bottom-nav,.topbar,.no-print,.warn{display:none !important}
  .app-main{max-width:100%;padding:0}
  .view{display:block !important}
  .card{border:1px solid #ddd;background:#fff;box-shadow:none;page-break-inside:avoid;color:#111}
  .muted,.acc-title span,.bar-labels,.disclaimer{color:#555 !important}
  h1,h2,h3,h4,.age-big,.stat b{color:#111 !important;-webkit-text-fill-color:#111;background:none}
  ul.clean li,.pillar p,.line-item b,.note p{color:#222 !important}
  .foot{background:none;border-top:1px solid #ddd;margin-top:14px}

/* ---- Instalación como app (PWA) + Service Worker ----
   Todo está protegido: si el navegador o el visor no lo permiten, la app sigue funcionando igual. */
(function () {
  try {
    var deferred = null, btn = document.getElementById('btnInstalar');

    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault(); deferred = e;
      if (btn) btn.classList.remove('hidden');
    });
    window.addEventListener('appinstalled', function () {
      deferred = null; if (btn) btn.classList.add('hidden');
    });
    if (btn) btn.addEventListener('click', function () {
      if (!deferred) return;
      deferred.prompt();
      deferred.userChoice.then(function (r) {
        if (r && r.outcome === 'accepted') btn.classList.add('hidden');
        deferred = null;
      }).catch(function () { });
    });

    // El registro va en su propia función con try/catch: en visores embebidos
    // (iframe con sandbox sin allow-same-origin) leer navigator.serviceWorker
    // lanza SecurityError, y eso no puede romper la app.
    function registrarSW() {
      try {
        if (!('serviceWorker' in navigator)) return;
        if (window.isSecureContext === false) return; // http sin TLS o iframe aislado: nada que hacer
        var seguro = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        if (!seguro) return;
        navigator.serviceWorker.register('sw.js').catch(function (e) {
          console.warn('Service Worker no registrado:', e && e.message);
        });
      } catch (e) { console.warn('Service Worker no disponible:', e && e.message); }
    }
    window.addEventListener('load', registrarSW);
  } catch (e) { console.warn('PWA no disponible en este visor:', e && e.message); }
})();
</script>

/* ------------------------ 6. FECHAS Y CÁLCULOS ------------------------ */
const isLeap = y => (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
const parseISO = s => { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const toISO = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const addDays = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; };
function addYears(d, n) { let dd = d.getDate(); if (d.getMonth() === 1 && dd === 29 && !isLeap(d.getFullYear() + n)) dd = 28; return new Date(d.getFullYear() + n, d.getMonth(), dd); }
function daysBetween(a, b) { return Math.round((Date.UTC(b.getFullYear(), b.getMonth(), b.getDate()) - Date.UTC(a.getFullYear(), a.getMonth(), a.getDate())) / 86400000); }
function aniv(birth, y) { let m = birth.getMonth(), d = birth.getDate(); if (m === 1 && d === 29 && !isLeap(y)) d = 28; return new Date(y, m, d); }
function ultimoCumple(b, hoy) { let c = aniv(b, hoy.getFullYear()); return c > hoy ? aniv(b, hoy.getFullYear() - 1) : c; }
function proximoCumple(b, hoy) { let c = aniv(b, hoy.getFullYear()); return daysBetween(hoy, c) <= 0 ? aniv(b, hoy.getFullYear() + 1) : c; }
function edad(b, hoy) {
  let y = hoy.getFullYear() - b.getFullYear(), m = hoy.getMonth() - b.getMonth(), d = hoy.getDate() - b.getDate();
  if (d < 0) { m--; d += new Date(hoy.getFullYear(), hoy.getMonth(), 0).getDate(); }
  if (m < 0) { y--; m += 12; }
  return { y, m, d };
}

function calcular(nacISO, hoy = new Date()) {
  const birth = parseISO(nacISO), e = edad(birth, hoy);
  const uc = ultimoCumple(birth, hoy), pc = proximoCumple(birth, hoy);
  const diasVividos = daysBetween(birth, hoy), dsc = daysBetween(uc, hoy), diasAnio = daysBetween(uc, pc);
  const idx = Math.min(Math.floor(e.y / 7), SEPTENIOS.length - 1), sept = SEPTENIOS[idx];
  const abierto = idx === SEPTENIOS.length - 1;
  const aniosEn = e.y - idx * 7;
  const progreso = abierto ? null : Math.min(Math.max((aniosEn + dsc / diasAnio) / 7, 0), 1);
  const nc = Math.min(Math.floor(dsc / 52) + 1, 7), ciclo = CICLOS[nc - 1];
  const ini = addDays(uc, 52 * (nc - 1)), largo = nc === 7 ? diasAnio - 312 : 52;
  const dia = Math.min(dsc - 52 * (nc - 1) + 1, largo);
  return {
    birth, hoy, e, uc, pc, diasVividos, dsc, diasAnio, idx, sept, aniosEn, progreso, abierto,
    nc, ciclo, dia, largo, ini, fin: addDays(ini, largo - 1),
    est: ESTRUCTURAS[sept.est], ciclosVividos: Math.floor(diasVividos / 52) + 1,
    progresoAnio: Math.min(dsc / 364, 1), proximo: daysBetween(hoy, pc),
    tramoFinal: e.y >= 69, anios60: e.y - 60
  };
}
function ciclosDelAnio(c) {
  return CICLOS.map((x, i) => { const ini = addDays(c.uc, 52 * i), largo = i === 6 ? c.diasAnio - 312 : 52; return { ...x, ini, fin: addDays(ini, largo - 1), largo }; });
}
function hitos(c) {
  const b = c.birth, hoy = c.hoy, out = [];
  const add = (nombre, fecha, nota) => { const d = daysBetween(hoy, fecha); if (d >= 0 && d < 365 * 40) out.push({ nombre, fecha, dias: d, nota }); };
  const proxSept = Math.floor(c.e.y / 7) * 7 + 7;
  add('Nuevo septenio (' + proxSept + ' años)', addYears(b, proxSept), 'Cambio de etapa; coincide con las cuadraturas de Saturno, cada 7 años.');
  const j = Math.floor(c.e.y / 12) * 12 + 12;
  add('Ciclo de Júpiter (' + j + ' años)', addYears(b, j), 'Ciclo de 12 años asociado a expansión y oportunidades.');
  [29, 58, 87].forEach(n => add('Retorno de Saturno (' + n + ')', addYears(b, n), 'Reestructuración y asunción de responsabilidades.'));
  add('Oposición de Urano (42)', addYears(b, 42), 'Replanteo de autenticidad y cambios liberadores.');
  add('Retorno de Urano (84)', addYears(b, 84), 'La vuelta completa: la creatividad de la vida como hecho consumado.');
  [[56, 'Inicio de la Tercera Estructura: el desenlace de la obra.'], [63, 'Segundo portal transpersonal: los frutos de la madurez creativa.'],
   [69, 'Umbral del último tramo: se entra en el territorio del legado.'], [70, 'Mitad del tercer círculo: nuevo giro de conciencia.'],
   [77, 'Cuarto portal: recapitulación, desapego y libertad.']].forEach(([n, nota]) => add('Etapa de los ' + n, addYears(b, n), nota));
  [18.5, 37, 55.5, 74].forEach(n => add('Nodo lunar (' + n + ')', addDays(b, Math.round(n * 365.25)), 'Punto de reorientación y decisiones de rumbo.'));
  return out.sort((a, x) => a.fecha - x.fecha).slice(0, 5);
}

  del(k) { try { if (PERSIST) localStorage.removeItem(k); } catch (e) { } delete MEM[k]; }
};

async function hash(txt) {
  const s = 'sp7::' + txt;
  if (window.crypto && window.crypto.subtle) {
    try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join(''); } catch (e) { }
  }
  let h1 = 0x811c9dc5, h2 = 0x1000193;
  for (let i = 0; i < s.length; i++) { h1 = (h1 ^ s.charCodeAt(i)) * 16777619 >>> 0; h2 = (h2 + s.charCodeAt(i) * (i + 7)) >>> 0; }
  return 'f' + h1.toString(16) + h2.toString(16);
}

function ringSVG(prog, actual, glifos = true) {
  const R = 70, CC = 2 * Math.PI * R, seg = CC / 7, gap = 7, cx = 100, cy = 100;
  let s = '<svg viewBox="0 0 200 200" role="img" aria-label="Rueda de los siete ciclos de 52 días">';
  s += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="currentColor" stroke-width="13" opacity=".08"/>`;
  for (let i = 0; i < 7; i++) {
    const a = i * (360 / 7) - 90, on = (i + 1) === actual;
    s += `<circle class="seg" cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${CICLOS[i].color}" stroke-width="${on ? 15 : 13}" stroke-linecap="round"
      stroke-dasharray="${seg - gap} ${CC - seg + gap}" opacity="${on ? 1 : .35}" transform="rotate(${a} ${cx} ${cy})"/>`;
    if (glifos) {
      const mid = (i * (360 / 7) + 25.7 - 90) * Math.PI / 180;
      s += `<text class="gl" x="${(cx + Math.cos(mid) * R).toFixed(1)}" y="${(cy + Math.sin(mid) * R).toFixed(1)}" opacity="${on ? 1 : .8}">${CICLOS[i].glifo}</text>`;
    }
  }
  const ang = (Math.min(prog, 1) * 360 - 90) * Math.PI / 180;
  s += `<circle cx="${(cx + Math.cos(ang) * R).toFixed(1)}" cy="${(cy + Math.sin(ang) * R).toFixed(1)}" r="6.5" fill="#fff" stroke="var(--bg)" stroke-width="2"/>`;
  s += `<text class="ctr" x="${cx}" y="${cy - 8}">${CICLOS[actual - 1].glifo} ${CICLOS[actual - 1].regente}</text>`;
  s += `<text class="ctr2" x="${cx}" y="${cy + 6}">día ${Math.round(Math.min(prog, 1) * 364)} de 364</text>`;
  s += `<text class="ctr2" x="${cx}" y="${cy + 20}" opacity=".8">${Math.round(Math.min(prog, 1) * 100)}% del año personal</text>`;
  return s + '</svg>';
}

    sv(K.notas, (ld(K.notas) || []).filter(n => n.id !== b.dataset.id)); renderDiario();
  }, 'Diario'));
}

      Por eso la misma etapa se vive distinto en el ciclo de Sol (arrancar) que en el de Saturno (cerrar).</p>
      <div style="margin-top:12px">
        ${CICLOS.map(x => `<div class="pillar" style="border-color:${x.color}33"><div class="ico" style="color:${x.color};font-size:1.15rem">${x.glifo}</div>
          <div><h4>${esc(x.regente)} · ${esc(x.palabra)}</h4><p>${esc(x.influencia)}</p></div></div>`).join('')}
      </div>
    </section>
    <section class="card">
      <p class="kicker">Fuentes y descargo</p>
      <h2 class="sec" style="margin-top:6px">De dónde viene esta información</h2>
      ${lista(FUENTES, 'mint')}
      <div class="disclaimer" style="margin-top:12px">Contenido simbólico, educativo y divulgativo. No es diagnóstico ni predicción, y no reemplaza la orientación de un profesional de la salud mental o médica.</div>
    </section>`;
}

/* ------------------------ 16. PERFIL ------------------------ */
function renderPerfil() {
  const u = USER;
  $('#view-perfil').innerHTML = `
    <section class="card">
      <p class="kicker">Mi perfil</p>
      <h2 class="sec" style="margin-top:6px">${esc(PERFIL.nombre)}</h2>
      <div style="margin-top:8px">
        <div class="line-item"><span>Nacimiento</span><b>${fmt(C.birth)}</b></div>
        <div class="line-item"><span>Edad</span><b>${C.e.y} años</b></div>
        <div class="line-item"><span>Etapa</span><b>${esc(C.sept.nombre)} (${esc(C.sept.rango)})</b></div>
        <div class="line-item"><span>Tramo</span><b>${esc(C.est.nombre)} · ${esc(C.est.rango)}</b></div>
        <div class="line-item"><span>Ciclo de 52 días</span><b>${C.ciclo.glifo} ${C.nc} · ${esc(C.ciclo.regente)}</b></div>
        <div class="line-item"><span>Ciclos vividos</span><b>${C.ciclosVividos.toLocaleString('es')}</b></div>
      </div>
      <div style="margin-top:12px" class="field"><span>Tu nombre</span><input type="text" id="perNom" value="${esc(PERFIL.nombre)}"></div>
      <div style="margin-top:10px" class="field"><span>Fecha de nacimiento</span><input type="date" id="perNac" value="${esc(PERFIL.nacimiento)}"></div>
      <div class="row" style="margin-top:12px">
        <button class="btn primary" id="btnEditPerfil" style="width:auto;padding:11px 18px">Guardar cambios</button>
        <button class="btn ghost" id="btnReset" style="width:auto">Volver al ejemplo</button>
      </div>
      <p class="msg" id="perMsg"></p>
    </section>

    ${u ? `
    <section class="card">
      <p class="kicker">Mi cuenta</p>
      <h2 class="sec" style="margin-top:6px">${esc(u.nombre)}</h2>
      <div style="margin-top:8px">
        <div class="line-item"><span>Correo</span><b>${esc(u.email)}</b></div>
        <div class="line-item"><span>Alta</span><b>${fmt(new Date(u.creado))}</b></div>
        <div class="line-item"><span>Pregunta secreta</span><b style="max-width:60%">${esc(u.pregunta)}</b></div>
      </div>
      <h3 class="mini" style="margin-top:14px">Cambiar clave secreta</h3>
      <div class="field"><span>Clave actual</span><input type="password" id="claveActual"></div>
      <div class="field" style="margin-top:10px"><span>Nueva clave</span>
        <div class="pwd-wrap"><input type="password" id="claveNueva"><button type="button" class="eye" data-target="claveNueva">◉</button></div></div>
      <div class="row" style="margin-top:10px">
        <button class="btn tiny" id="btnGenClave">Generar clave nueva sugerida</button>
        <button class="btn primary" id="btnClave" style="width:auto;padding:11px 16px">Actualizar</button>
      </div>
      <p class="msg" id="claveMsg"></p>
      <div class="row" style="margin-top:12px">
        <button class="btn ghost" id="btnSalir" style="width:auto;color:var(--gold)">Cerrar sesión</button>
        <button class="btn danger" id="btnBorrar" style="width:auto">Eliminar mi cuenta</button>
      </div>
    </section>` : `
    <section class="card">
      <p class="kicker">Crear cuenta</p>
      <h2 class="sec" style="margin-top:6px">Guarda tu perfil con clave secreta</h2>
      <p class="muted">Opcional: te permite entrar con tu correo y recuperar la clave si la olvidas. Todo se guarda en este dispositivo.</p>
      <div style="margin-top:12px" class="field"><span>Correo electrónico</span><input type="email" id="regEmail" placeholder="tu@correo.com"></div>
      <div style="margin-top:10px" class="field"><span>Clave secreta</span>
        <div class="pwd-wrap"><input type="password" id="regPass" placeholder="Mínimo 6 caracteres"><button type="button" class="eye" data-target="regPass">◉</button></div></div>
      <div style="margin-top:10px" class="field"><span>Pregunta de seguridad</span>
        <select id="regPreg">
          <option>¿Nombre de tu primera mascota?</option>
          <option>¿Ciudad donde naciste?</option>
          <option>¿Nombre de tu maestra o maestro favorito?</option>
          <option>¿Tu mejor amigo de la infancia?</option>
        </select></div>
      <div style="margin-top:10px" class="field"><span>Respuesta secreta</span><input type="text" id="regResp" placeholder="Se guarda cifrada"></div>
      <div class="row" style="margin-top:12px">
        <button class="btn tiny" id="btnGenClave2">Sugerir clave</button>
        <button class="btn primary" id="btnCrear" style="width:auto;padding:11px 18px">Crear cuenta</button>
      </div>
      <p class="msg" id="regMsg"></p>
      <div id="loginBox" class="hidden" style="margin-top:14px;border-top:1px solid var(--line);padding-top:14px">
        <h3 class="mini">¿Ya tienes cuenta?</h3>
        <div class="field"><span>Correo</span><input type="email" id="logEmail"></div>
        <div class="field" style="margin-top:10px"><span>Clave</span><input type="password" id="logPass"></div>
        <div class="row" style="margin-top:10px">
          <button class="btn primary" id="btnLogin" style="width:auto;padding:11px 16px">Entrar</button>
          <button class="btn ghost" id="btnRec" style="width:auto">Olvidé mi clave</button>
        </div>
        <p class="msg" id="logMsg"></p>
        <div id="recBox" class="hidden" style="margin-top:12px;border-top:1px solid var(--line);padding-top:12px">
          <h3 class="mini">Recuperar clave</h3>
          <p class="muted" id="recPreg"></p>
          <div style="margin-top:10px" class="field"><span>Tu respuesta secreta</span><input type="text" id="recResp"></div>
          <div style="margin-top:10px" class="field"><span>Nueva clave</span>
            <div class="pwd-wrap"><input type="password" id="recNew"><button type="button" class="eye" data-target="recNew">◉</button></div></div>
          <div class="row" style="margin-top:10px">
            <button class="btn primary" id="btnRecGo" style="width:auto;padding:11px 16px">Guardar nueva clave</button>
          </div>
          <p class="msg" id="recMsg"></p>
        </div>
      </div>
      <button class="btn ghost" id="btnShowLogin" style="width:auto;margin-top:10px">Ya tengo cuenta</button>
    </section>`}

    <section class="card">
      <p class="kicker">Privacidad</p>
      <p class="muted" style="margin-top:6px">${PERSIST
        ? 'Tus datos y tu clave (cifrada) se guardan únicamente en este dispositivo. No hay servidor ni envío de información. Si borras los datos del navegador, la cuenta desaparece.'
        : 'Este visor no permite guardar datos: podés usar todo el contenido, pero tu cuenta y tus notas no sobreviven al recargar. Abrí el archivo en el navegador para conservarlos.'}</p>
    </section>`;

  $('#btnEditPerfil').onclick = safe(() => {
    const n = $('#perNom').value.trim() || PERFIL.nombre, f = $('#perNac').value, m = $('#perMsg');
    m.className = 'msg';
    if (!/^\d{4}-\d{2}-\d{2}$/.test(f) || parseISO(f) > new Date()) { m.textContent = 'Fecha de nacimiento inválida.'; return; }
    aplicarPerfil({ nombre: n, nacimiento: f }, true);
    m.className = 'msg ok'; m.textContent = 'Datos guardados.';
  }, 'Perfil');
  const br = $('#btnReset');
  if (br) br.onclick = safe(() => { rm(K.perfil); cargarEstado(); aplicarPerfil(PERFIL, false); toast('Volviste al ejemplo.'); }, 'Perfil');

  if (u) {
    $('#btnGenClave').onclick = safe(() => { const k = claveSugerida(); $('#claveNueva').value = k; $('#claveNueva').type = 'text'; toast('Clave sugerida: ' + k); }, 'Clave');
    $('#btnClave').onclick = safe(async () => {
      const m = $('#claveMsg'); m.className = 'msg';
      if (await hash($('#claveActual').value + u.email) !== u.hash) return m.textContent = 'La clave actual no es correcta.';
      const nv = $('#claveNueva').value;
      if (nv.length < 6) return m.textContent = 'La nueva clave debe tener al menos 6 caracteres.';
      const nu = { ...u, hash: await hash(nv + u.email) }; sv(K.user, nu); USER = nu;
      m.className = 'msg ok'; m.textContent = 'Clave actualizada.'; renderPerfil();
    }, 'Clave');
    $('#btnSalir').onclick = safe(() => { sv(K.perfil, PERFIL); USER = null; rm(K.user); renderPerfil(); toast('Sesión cerrada; tu perfil sigue guardado.'); }, 'Sesión');
    $('#btnBorrar').dataset.armado = '';
    $('#btnBorrar').onclick = safe(() => {
      const b = $('#btnBorrar');
      if (b.dataset.armado !== '1') { b.dataset.armado = '1'; b.textContent = 'Confirmar eliminación'; toast('Tocá otra vez para confirmar.'); return; }
      rm(K.user); rm(K.perfil); rm(K.notas); rm(K.plan); USER = null;
      cargarEstado(); aplicarPerfil(PERFIL, false); toast('Cuenta eliminada.');
    }, 'Cuenta');
  } else {
    const gen = $('#btnGenClave2');
    if (gen) gen.onclick = safe(() => { const k = claveSugerida(); $('#regPass').value = k; $('#regPass').type = 'text'; toast('Clave sugerida: ' + k); }, 'Clave');
    $('#btnCrear').onclick = safe(async () => {
      const email = norm($('#regEmail').value), pass = $('#regPass').value, resp = $('#regResp').value.trim();
      const m = $('#regMsg'); m.className = 'msg';
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return m.textContent = 'Revisa tu correo.';
      if (pass.length < 6) return m.textContent = 'La clave debe tener al menos 6 caracteres.';
      if (!resp) return m.textContent = 'Escribe la respuesta secreta.';
      USER = { nombre: PERFIL.nombre, email, nacimiento: PERFIL.nacimiento, hash: await hash(pass + email), pregunta: $('#regPreg').value, respuesta: await hash(norm(resp) + email), creado: new Date().toISOString() };
      sv(K.user, USER); sv(K.perfil, PERFIL);
      m.className = 'msg ok'; m.textContent = 'Cuenta creada en este dispositivo.'; renderPerfil();
    }, 'Cuenta');
    const sl = $('#btnShowLogin');
    if (sl) sl.onclick = safe(() => { $('#loginBox').classList.remove('hidden'); sl.classList.add('hidden'); }, 'Login');
    const bl = $('#btnLogin');
    if (bl) bl.onclick = safe(async () => {
      const email = norm($('#logEmail').value), m = $('#logMsg'); m.className = 'msg';
      const u2 = ld(K.user);
      if (!u2 || u2.email !== email) return m.textContent = 'No hay cuenta con ese correo en este dispositivo.';
      if (await hash($('#logPass').value + email) !== u2.hash) return m.textContent = 'La clave no coincide.';
      USER = u2; PERFIL = { nombre: u2.nombre, nacimiento: u2.nacimiento }; C = calcular(PERFIL.nacimiento);
      m.className = 'msg ok'; m.textContent = 'Sesión iniciada.'; renderPerfil(); renderTodo();
    }, 'Login');
    const br2 = $('#btnRec');
    if (br2) br2.onclick = safe(() => {
      const u2 = ld(K.user);
      if (!u2) return toast('No hay cuenta guardada en este dispositivo.', false);
      $('#recBox').classList.remove('hidden');
      $('#recPreg').textContent = 'Pregunta de seguridad: ' + u2.pregunta;
      $('#recResp').focus();
    }, 'Recuperar');
    const bg = $('#btnRecGo');
    if (bg) bg.onclick = safe(async () => {
      const u2 = ld(K.user), m = $('#recMsg'); m.className = 'msg';
      if (!u2) return m.textContent = 'No hay cuenta guardada.';
      if (await hash(norm($('#recResp').value) + u2.email) !== u2.respuesta) return m.textContent = 'La respuesta secreta no coincide.';
      const np = $('#recNew').value;
      if (np.length < 6) return m.textContent = 'La nueva clave debe tener al menos 6 caracteres.';
      const nu = { ...u2, hash: await hash(np + u2.email) }; sv(K.user, nu); USER = nu;
      m.className = 'msg ok'; m.textContent = 'Clave actualizada. Ya podés entrar con la nueva.';
      $('#recBox').classList.add('hidden'); renderPerfil();
    }, 'Recuperar');
  }
  $$('#view-perfil .eye').forEach(b => b.onclick = () => { const i = document.getElementById(b.dataset.target); if (i) i.type = i.type === 'password' ? 'text' : 'password'; });
}
function claveSugerida() {
  const a = ['Luna', 'Rio', 'Aire', 'Faro', 'Nube', 'Bosque', 'Cielo', 'Marea'], b = ['Nueve', 'Siete', 'Dos', 'Doce', 'Cinco'], s = ['!', '#', '*', '+'];
  return a[Math.random() * a.length | 0] + b[Math.random() * b.length | 0] + (Math.random() * 90 + 10 | 0) + s[Math.random() * s.length | 0];
}

/* ------------------------ 17. NAVEGACIÓN ------------------------ */
const VISTAS = ['informe', 'septenios', 'ciclos', 'mente', 'diario', 'glosario', 'perfil'];
function go(v, tocarHash = true) {
  if (!VISTAS.includes(v)) v = 'informe';
  $$('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.view === v));
  $$('.view').forEach(x => x.classList.remove('active'));
  const el = $('#view-' + v); if (el) el.classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
  // guardamos la vista en la URL sin crear entradas de historial (no bloquea el botón "atrás")
  try { if (tocarHash && location.hash !== '#' + v) history.replaceState(null, '', '#' + v); } catch (e) { }
}
function renderTodo() {
  [['Informe', renderInforme], ['Septenios', renderSeptenios], ['Ciclos', renderCiclos],
   ['Mente 60+', renderMente60], ['Diario', renderDiario], ['Glosario', renderGlosario], ['Perfil', renderPerfil]]
    .forEach(([n, fn]) => { try { fn(); } catch (err) { console.error(n, err); toast('Error al mostrar ' + n + ': ' + err.message, false); } });
}

/* ------------------------ 18. ARRANQUE ------------------------ */
function init() {
  let dots = '';
  for (let i = 0; i < 7; i++) { const a = (i * (360 / 7) - 90) * Math.PI / 180; dots += `<circle cx="${(50 + Math.cos(a) * 38).toFixed(1)}" cy="${(50 + Math.sin(a) * 38).toFixed(1)}" r="3.4" fill="currentColor" opacity=".8"/>`; }
  $('#brandDots').innerHTML = dots;

  const w = $('#warn');
  if (!PERSIST && w) { w.innerHTML = '<b>Este visor no permite guardar datos.</b> Podés usar toda la app igual; para conservar cuenta y notas, abrí el archivo en el navegador.'; w.classList.remove('hidden'); }

  cargarEstado();
  C = calcular(PERFIL.nacimiento);
  $('#tagLine').textContent = PERFIL.nombre + ' · ' + C.sept.nombre + ' · ciclo ' + C.nc;
  const nacInput = $('#onbNac'); if (nacInput) nacInput.max = toISO(new Date());
  renderTodo();

  $('#btnTema').onclick = safe(() => {
    const claro = document.documentElement.dataset.theme === 'claro';
    document.documentElement.dataset.theme = claro ? 'oscuro' : 'claro';
    sv('sp7_tema', claro ? 'oscuro' : 'claro');
    $$('.view').forEach(x => x.classList.remove('active')); $('#view-informe').classList.add('active');
    try { renderCiclos(); } catch (e) { }
  }, 'Tema');
  $('#btnFechaTop').onclick = safe(abrirFecha, 'Fecha');
  $$('.nav-item').forEach(b => b.onclick = safe(() => go(b.dataset.view), 'Navegación'));

  const t = ld('sp7_tema'); if (t) document.documentElement.dataset.theme = t;

  // abrir directamente una vista por URL (#mente, #ciclos, ...) y reaccionar si cambia
  const inicial = (location.hash || '').replace('#', '');
  if (VISTAS.includes(inicial)) go(inicial, false);
  window.addEventListener('hashchange', () => {
    const h = (location.hash || '').replace('#', '');
    if (VISTAS.includes(h)) go(h, false);
  });
}
window.addEventListener('error', e => { if (e && e.message) toast('Error: ' + e.message, false); });
window.addEventListener('unhandledrejection', e => toast('Error: ' + (e.reason && e.reason.message ? e.reason.message : 'inesperado'), false));
const arrancar = () => { try { init(); } catch (err) { console.error(err); toast('No se pudo iniciar: ' + err.message, false); } };
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arrancar); else arrancar();

</script>
</body>
</html>
